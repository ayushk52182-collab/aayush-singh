<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Parul University</title>
  <meta name="description" content="Your Parul University dashboard — view your profile, account details, and manage your settings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
</head>

<body>

  <!-- Back to Home -->
  <a href="./index.html" class="auth-back" id="backHome">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
    Back to Home
  </a>

  <!-- Theme Toggle -->
  <button class="auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

  <!-- Dashboard Page -->
  <main class="auth-page">

    <!-- Loading State -->
    <div class="dashboard-container" id="loadingState">
      <div class="dashboard-loading">
        <div class="spinner-lg"></div>
        <p>Loading your dashboard...</p>
      </div>
    </div>

    <!-- Dashboard Content (hidden until loaded) -->
    <div class="dashboard-container" id="dashboardContent" style="display: none;">

      <!-- Header -->
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-welcome">
            Welcome, <span class="gradient-text" id="welcomeName">User</span> 👋
          </h1>
          <div id="dashboardModeBadge" style="font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;"></div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Logout
        </button>
      </div>

      <!-- Profile Card -->
      <div class="profile-card" id="profileCard">
        <div class="profile-top">
          <div class="profile-avatar" id="profileAvatar">A</div>
          <div class="profile-info">
            <h2 id="profileName">Loading...</h2>
            <p class="profile-email">
              <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></svg>
              <span id="profileEmail">loading...</span>
            </p>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">👤</div>
            <div class="stat-label">Full Name</div>
            <div class="stat-value" id="statName">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📧</div>
            <div class="stat-label">Email Address</div>
            <div class="stat-value" id="statEmail">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-label">Member Since</div>
            <div class="stat-value" id="statDate">—</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
    (function () {
      'use strict';

      // ─── Theme Toggle ───
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('pu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pu-theme', next);
        themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      // ─── Elements ───
      const loadingState = document.getElementById('loadingState');
      const dashboardContent = document.getElementById('dashboardContent');
      const logoutBtn = document.getElementById('logoutBtn');

      // ─── Format Date ───
      function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-IN', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      // ─── Get Initials ───
      function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return parts[0][0].toUpperCase();
      }

      // ─── Load Dashboard ───
      async function loadDashboard() {
        try {
          // Check session
          const { data: sessionData } = await window.SupabaseAuth.getSession();

          if (!sessionData.session) {
            // Not logged in — redirect to login
            window.location.href = './login.html';
            return;
          }

          const user = sessionData.session.user;

          // Fetch profile from database
          const { data: profile, error: profileError } = await window.SupabaseAuth.getProfile(user.id);

          // Use profile data if available, fall back to auth user metadata
          const fullName = profile?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'User';
          const email = profile?.email || user.email || '—';
          const createdAt = profile?.created_at || user.created_at;

          // Mode Badge
          const modeBadge = document.getElementById('dashboardModeBadge');
          if (modeBadge) {
            if (window.SupabaseAuth.isLiveMode()) {
              modeBadge.innerHTML = '🟢 Supabase Cloud Database Connected';
              modeBadge.style.background = 'rgba(104, 178, 155, 0.15)';
              modeBadge.style.color = '#10b981';
              modeBadge.style.border = '1px solid rgba(16, 185, 129, 0.3)';
            } else {
              modeBadge.innerHTML = '⚡ Demo Database &bull; Add Supabase credentials in supabase-config.js to connect live';
              modeBadge.style.background = 'rgba(212, 168, 67, 0.12)';
              modeBadge.style.color = '#b45309';
              modeBadge.style.border = '1px solid rgba(212, 168, 67, 0.25)';
            }
          }

          // Populate UI
          document.getElementById('welcomeName').textContent = fullName.split(' ')[0];
          document.getElementById('profileAvatar').textContent = getInitials(fullName);
          document.getElementById('profileName').textContent = fullName;
          document.getElementById('profileEmail').textContent = email;
          document.getElementById('statName').textContent = fullName;
          document.getElementById('statEmail').textContent = email;
          document.getElementById('statDate').textContent = formatDate(createdAt);

          // Show dashboard
          loadingState.style.display = 'none';
          dashboardContent.style.display = 'block';

        } catch (err) {
          console.error('Dashboard load error:', err);
          // On error, redirect to login
          window.location.href = './login.html';
        }
      }

      // ─── Logout ───
      logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true;
        logoutBtn.innerHTML = `
          <div class="spinner" style="display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--pu-lavender); border-radius:50%; animation:authSpin 0.6s linear infinite;"></div>
          Logging out...
        `;

        try {
          await window.SupabaseAuth.signOut();
          window.location.href = './login.html';
        } catch (err) {
          console.error('Logout error:', err);
          window.location.href = './login.html';
        }
      });

      // ─── Initialize ───
      loadDashboard();
    })();
  </script>

</body>

</html>
