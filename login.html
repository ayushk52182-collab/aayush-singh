<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Parul University</title>
  <meta name="description" content="Sign in to your Parul University account to access your dashboard, courses, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
</head>

<body>

  <!-- Back to Home -->
  <a href="./index.html" class="auth-back" id="backHome">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
    Back to Home
  </a>

  <!-- Theme Toggle -->
  <button class="auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

  <!-- Login Page -->
  <main class="auth-page">
    <div class="auth-card" id="loginCard">

      <!-- Header -->
      <div class="auth-header">
        <div id="modeBadge" style="font-size: 11.5px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 12px;"></div>
        <div class="auth-logo">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
          Don't have an account? <a href="./signup.html">Sign up</a>
        </p>
      </div>

      <!-- Alert Messages -->
      <div class="auth-alert auth-alert-error" id="errorAlert">
        <span class="auth-alert-icon">⚠️</span>
        <span id="errorMessage">Something went wrong.</span>
      </div>
      <div class="auth-alert auth-alert-success" id="successAlert">
        <span class="auth-alert-icon">✅</span>
        <span id="successMessage">Login successful!</span>
      </div>

            <!-- Sign In with Google -->
      <button type="button" class="btn-google-auth" id="googleSignInBtn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign In with Google</span>
      </button>

      <div class="auth-divider" style="margin-bottom: 20px;">or sign in with email</div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-input" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required minlength="6" autocomplete="current-password" />
        </div>

        <button type="submit" class="auth-btn" id="loginBtn">
          <span class="btn-text">Sign In →</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <!-- Quick Sign Up CTA -->
      <a href="./signup.html" class="auth-btn" style="background: transparent; border: 1.5px solid var(--border-accent); color: var(--pu-lavender); text-align: center; display: block; text-decoration: none; margin-top: 0;">
        <span class="btn-text">Create New Account</span>
      </a>

    </div>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
    (function () {
      'use strict';

      // ─── Theme Toggle ───
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('pu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pu-theme', next);
        themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      // ─── Mode Badge ───
      const modeBadge = document.getElementById('modeBadge');
      if (window.SupabaseAuth && modeBadge) {
        if (window.SupabaseAuth.isLiveMode()) {
          modeBadge.innerHTML = '🟢 Supabase Cloud Connected';
          modeBadge.style.background = 'rgba(104, 178, 155, 0.15)';
          modeBadge.style.color = '#10b981';
          modeBadge.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        } else {
          modeBadge.innerHTML = '⚡ Demo Mode &bull; Add Supabase credentials in supabase-config.js to connect live';
          modeBadge.style.background = 'rgba(212, 168, 67, 0.12)';
          modeBadge.style.color = '#b45309';
          modeBadge.style.border = '1px solid rgba(212, 168, 67, 0.25)';
        }
      }

      // ─── Elements ───
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');

      // ─── Helper: Show Alert ───
      function showError(msg) {
        successAlert.classList.remove('show');
        errorMessage.textContent = msg;
        errorAlert.classList.add('show');
      }

      function showSuccess(msg) {
        errorAlert.classList.remove('show');
        successMessage.textContent = msg;
        successAlert.classList.add('show');
      }

      function hideAlerts() {
        errorAlert.classList.remove('show');
        successAlert.classList.remove('show');
      }

      // ─── Form Submit ───
      // ─── Google Sign In ───
      const googleBtn = document.getElementById('googleSignInBtn');
      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          hideAlerts();
          googleBtn.style.opacity = '0.7';
          googleBtn.style.pointerEvents = 'none';

          try {
            const { error } = await window.SupabaseAuth.signInWithGoogle();
            if (error) {
              showError(error.message);
            } else {
              showSuccess('Google Authentication successful! Redirecting...');
              setTimeout(() => {
                window.location.href = './dashboard.html';
              }, 800);
            }
          } catch (err) {
            showError('Failed to sign in with Google. Please try again.');
          } finally {
            googleBtn.style.opacity = '1';
            googleBtn.style.pointerEvents = 'auto';
          }
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlerts();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Validation
        if (!email) return showError('Please enter your email address.');
        if (!password) return showError('Please enter your password.');

        // Set loading
        btn.classList.add('loading');
        btn.disabled = true;

        try {
          const { data, error } = await window.SupabaseAuth.signIn(email, password);

          if (error) {
            showError(error.message);
          } else {
            showSuccess('Login successful! Redirecting...');
            setTimeout(() => {
              window.location.href = './dashboard.html';
            }, 1000);
          }
        } catch (err) {
          showError('An unexpected error occurred. Please try again.');
          console.error(err);
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ─── Redirect if already logged in ───
      (async () => {
        const { data } = await window.SupabaseAuth.getSession();
        if (data.session) {
          window.location.href = './dashboard.html';
        }
      })();
    })();
  </script>

</body>

</html>
