    // --- LOCKED TEMPLATE COMPONENT (WeddingCardTemplate) ---

    function WeddingCardTemplate({ data, innerRef }) {
      return (
        <div 
          id="printable-wedding-card" 
          ref={innerRef}
          className="wedding-card-canvas relative bg-[#FFFDF5] text-[#4A0000] p-6 sm:p-8 flex flex-col justify-between items-center text-center shadow-2xl rounded-sm overflow-hidden select-none border-[12px] border-[#8B0000]"
          style={{

        >
          {/* Traditional Ornate Inner Red & Gold Double Border */}
          <div className="absolute inset-2 border-2 border-[#D4AF37] pointer-events-none"></div>
          <div className="absolute inset-3 border border-[#8B0000]/60 pointer-events-none"></div>

          <div className="absolute top-4 left-4 text-[#8B0000] font-bold text-lg pointer-events-none">卐</div>

          {/* 1. TOP HEADER: Shri Ganesh Ji Icon & Sanskrit Shlok */}

              <div className="text-xs text-[#4A0000] font-tiro font-semibold">
                सुपुत्री: {data.brideMother ? `श्रीमती ${data.brideMother.replace(/^श्रीमती\s*/, '')} एवं ` : ''}श्री {data.brideFather ? data.brideFather.replace(/^श्री\s*/, '') : '{वधू_पिता_नाम}'}
              </div>
              <div className="text-[11px] text-[#660000] font-yantra">
                निवासी: {data.brideAddress || '{वधू_पता}'}
              </div>
            </div>

            {/* Middle Weds Icon / Symbol */}
            <div className="col-span-2 text-center flex flex-col items-center justify-center">
              <div className="w-8 h-8 rounded-full bg-[#8B0000] text-[#FFD700] font-rozha text-xs flex items-center justify-center font-bold shadow-sm border border-[#D4AF37]">
                संग
              </div>
              <div className="text-[10px] font-tiro italic text-[#8B0000] font-bold mt-1">
                परिणय सूत्र
              </div>
            </div>

            {/* Groom Side Column */}

                ॥ वर पक्ष ॥
              </div>
              <h2 className="font-rozha text-2xl text-[#8B0000] font-bold">
                {data.groomName || '{वर_नाम}'}
              </h2>
              <div className="text-xs text-[#4A0000] font-tiro font-semibold">
                सुपुत्र: {data.groomMother ? `श्रीमती ${data.groomMother.replace(/^श्रीमती\s*/, '')} एवं ` : ''}श्री {data.groomFather ? data.groomFather.replace(/^श्री\s*/, '') : '{वर_पिता_नाम}'}

              <div className="text-[11px] text-[#660000] font-yantra">
                निवासी: {data.groomAddress || '{वर_पता}'}
              </div>
            </div>

          </div>

    // --- MAIN APP COMPONENT ---
    function App() {
      const [cardData, setCardData] = useState(SAMPLE_CARD_DATA);
      const [currentStep, setCurrentStep] = useState(1);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);

      const cardRef = useRef(null);
      const modalCardRef = useRef(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentStep, isModalOpen]);

      const handleInputChange = (field, value) => {
        setCardData(prev => ({ ...prev, [field]: value }));
      };

      const handleFillSample = () => {
        setCardData(SAMPLE_CARD_DATA);
      };

      const handleResetForm = () => {
        if (confirm('क्या आप निश्चित रूप से सभी फ़ॉर्म फ़ील्ड रीसेट करना चाहते हैं?')) {
          setCardData(EMPTY_CARD_DATA);
        }
      };

      // 300 DPI Export as PNG
      const exportAsPNG = async (targetRef) => {
        const node = targetRef.current || cardRef.current;
        if (!node) return;
        setIsExporting(true);
        try {
          const canvas = await html2canvas(node, {
            scale: 3, // 300 DPI high resolution
            useCORS: true,
            backgroundColor: '#FFFDF5'
          });
          const image = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `shadi_card_${cardData.brideName || 'vadhusharma'}_${cardData.groomName || 'varnya'}.png`;
          link.href = image;
          link.click();
        } catch (err) {
          console.error('PNG Export Failed', err);
          alert('PNG निर्यात विफल रहा। पुनः प्रयास करें।');
        } finally {
          setIsExporting(false);
        }
      };

      // 300 DPI Export as PDF (Fixed 250mm x 210mm)
      const exportAsPDF = async (targetRef) => {
        const node = targetRef.current || cardRef.current;
        if (!node) return;
        setIsExporting(true);
        try {
          const canvas = await html2canvas(node, { scale: 3, useCORS: true });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: [250, 210] // Exactly 250mm x 210mm
          });
          pdf.addImage(imgData, 'PNG', 0, 0, 250, 210);
          pdf.save(`shadi_card_${cardData.brideName || 'vadhusharma'}_${cardData.groomName || 'varnya'}.pdf`);
        } catch (err) {
          console.error('PDF Export Failed', err);
          alert('PDF निर्यात विफल रहा। पुनः प्रयास करें।');
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 font-yantra">

          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-red-600 via-amber-500 to-yellow-400 p-0.5 shadow-md">
                <div className="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-amber-400 font-rozha text-xl">
                  卐
                </div>
              </div>
              <div>
                <span className="font-rozha text-xl font-bold tracking-wider gold-gradient-text">विवाह पत्रिका जनरेटर</span>
                <span className="text-xs text-slate-400 block font-yantra">250mm x 210mm Locked Format</span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={handleFillSample}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 transition-all">
                <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                नमूना डेटा भरें
              </button>
              <button 
                onClick={() => setIsModalOpen(true)}
                className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-red-700 to-amber-600 hover:brightness-110 text-white shadow-md transition-all">
                <i data-lucide="eye" className="w-4 h-4"></i>
                पूर्ण कार्ड देखें
              </button>
            </div>
          </header>

          {/* MAIN TWO-COLUMN CONTENT AREA */}
          <main className="max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 flex-1">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* LEFT COLUMN: MULTI-STEP FORM (25+ Devanagari Input Fields) */}
              <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
                
                {/* Form Header & Step Indicator */}
                <div className="space-y-4 pb-6 border-b border-slate-800">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-rozha font-bold text-amber-400">विवाह विवरण फ़ॉर्म (Card Data Input)</h2>
                      <p className="text-xs text-slate-400 font-yantra">चरण {currentStep} / 4 - केवल टेक्स्ट मान बदलें (Design Locked)</p>
                    </div>
                    <button 
                      onClick={handleResetForm}
                      className="px-3 py-1 rounded bg-slate-800 hover:bg-red-950 text-rose-300 text-xs font-semibold transition-all">
                      रीसेट फ़ॉर्म
                    </button>
                  </div>

                  {/* Step Buttons */}
                  <div className="grid grid-cols-4 gap-2">
                    {[
                      { step: 1, title: 'वधू पक्ष' },
                      { step: 2, title: 'वर पक्ष' },
                      { step: 3, title: 'तिथि व स्थान' },
                      { step: 4, title: 'आशीर्वाद' }
                    ].map(s => (
                      <button 
                        key={s.step}
                        onClick={() => setCurrentStep(s.step)}
                        className={`py-2 px-1 text-center rounded-lg border text-xs font-bold transition-all ${
                          currentStep === s.step 
                            ? 'bg-amber-500/10 border-amber-500 text-amber-300' 
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800'
                        }`}>
                        <div>चरण {s.step}</div>
                        <div className="text-[11px] font-normal">{s.title}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* FORM INPUT FIELDS */}
                <div className="py-6 space-y-5">
                  
                  {/* STEP 1: वधू पक्ष (Bride's Side) */}
                  {currentStep === 1 && (
                    <div className="space-y-4 animate-fadeIn">
                      <div className="text-amber-400 font-rozha font-bold text-base border-b border-slate-800 pb-2">
                        🔸 वधू पक्ष का विवरण (Bride's Details):
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वधू का नाम *</label>
                          <input 
                            type="text" 
                            value={cardData.brideName}
                            onChange={(e) => handleInputChange('brideName', e.target.value)}
                            placeholder="उदा. आयुष्मती दिव्यांशी"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>

                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वधू के पिता का नाम *</label>
                          <input 
                            type="text" 
                            value={cardData.brideFather}
                            onChange={(e) => handleInputChange('brideFather', e.target.value)}
                            placeholder="उदा. श्री रामनरेश शर्मा"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वधू की माता का नाम</label>
                          <input 
                            type="text" 
                            value={cardData.brideMother}
                            onChange={(e) => handleInputChange('brideMother', e.target.value)}
                            placeholder="उदा. श्रीमती सुनीता देवी"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>

                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वधू का पता</label>
                          <input 
                            type="text" 
                            value={cardData.brideAddress}
                            onChange={(e) => handleInputChange('brideAddress', e.target.value)}
                            placeholder="उदा. ग्राम - रामपुर, शास्त्री नगर"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      </div>

                      <div className="space-y-2 pt-2 border-t border-slate-800">
                        <label className="text-xs font-bold text-amber-400 uppercase">वधू पक्ष परिवार के सदस्य (5 members):</label>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <input type="text" value={cardData.brideFamily1} onChange={(e) => handleInputChange('brideFamily1', e.target.value)} placeholder="सदस्य 1 (उदा. चाची जी)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.brideFamily2} onChange={(e) => handleInputChange('brideFamily2', e.target.value)} placeholder="सदस्य 2 (उदा. ताऊ जी)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.brideFamily3} onChange={(e) => handleInputChange('brideFamily3', e.target.value)} placeholder="सदस्य 3 (उदा. भाई)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.brideFamily4} onChange={(e) => handleInputChange('brideFamily4', e.target.value)} placeholder="सदस्य 4" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.brideFamily5} onChange={(e) => handleInputChange('brideFamily5', e.target.value)} placeholder="सदस्य 5" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 2: वर पक्ष (Groom's Side) */}
                  {currentStep === 2 && (
                    <div className="space-y-4 animate-fadeIn">
                      <div className="text-amber-400 font-rozha font-bold text-base border-b border-slate-800 pb-2">
                        🔸 वर पक्ष का विवरण (Groom's Details):
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वर का नाम *</label>
                          <input 
                            type="text" 
                            value={cardData.groomName}
                            onChange={(e) => handleInputChange('groomName', e.target.value)}
                            placeholder="उदा. आयुष्मान आदित्यराज"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>

                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वर के पिता का नाम *</label>
                          <input 
                            type="text" 
                            value={cardData.groomFather}
                            onChange={(e) => handleInputChange('groomFather', e.target.value)}
                            placeholder="उदा. श्री विजेंद्र पाल सिंह"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वर की माता का नाम</label>
                          <input 
                            type="text" 
                            value={cardData.groomMother}
                            onChange={(e) => handleInputChange('groomMother', e.target.value)}
                            placeholder="उदा. श्रीमती रेखा सिंह"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>

                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">वर का पता</label>
                          <input 
                            type="text" 
                            value={cardData.groomAddress}
                            onChange={(e) => handleInputChange('groomAddress', e.target.value)}
                            placeholder="उदा. ग्राम - आनंदपुर, राजेंद्र नगर"
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      </div>

                      <div className="space-y-2 pt-2 border-t border-slate-800">
                        <label className="text-xs font-bold text-amber-400 uppercase">वर पक्ष परिवार के सदस्य (5 members):</label>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <input type="text" value={cardData.groomFamily1} onChange={(e) => handleInputChange('groomFamily1', e.target.value)} placeholder="सदस्य 1 (उदा. दादा जी)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.groomFamily2} onChange={(e) => handleInputChange('groomFamily2', e.target.value)} placeholder="सदस्य 2 (उदा. चाचा जी)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.groomFamily3} onChange={(e) => handleInputChange('groomFamily3', e.target.value)} placeholder="सदस्य 3 (उदा. भाई)" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.groomFamily4} onChange={(e) => handleInputChange('groomFamily4', e.target.value)} placeholder="सदस्य 4" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.groomFamily5} onChange={(e) => handleInputChange('groomFamily5', e.target.value)} placeholder="सदस्य 5" className="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 3: कार्यक्रम एवं स्थान (Events & Location) */}
                  {currentStep === 3 && (
                    <div className="space-y-4 animate-fadeIn">
                      <div className="text-amber-400 font-rozha font-bold text-base border-b border-slate-800 pb-2">
                        📅 कार्यक्रम एवं स्थान विवरण (Event & Location Details):
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">हल्दी तिथि</label>
                          <input type="text" value={cardData.haldiDate} onChange={(e) => handleInputChange('haldiDate', e.target.value)} placeholder="शुक्रवार, 13 नवम्बर 2026" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">तिलक तिथि</label>
                          <input type="text" value={cardData.tilakDate} onChange={(e) => handleInputChange('tilakDate', e.target.value)} placeholder="शनिवार, 14 नवम्बर 2026" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">विवाह तिथि *</label>
                          <input type="text" value={cardData.vivahDate} onChange={(e) => handleInputChange('vivahDate', e.target.value)} placeholder="रविवार, 15 नवम्बर 2026" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">दिन</label>
                          <input type="text" value={cardData.eventDay} onChange={(e) => handleInputChange('eventDay', e.target.value)} placeholder="रविवार" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs font-semibold text-slate-300">संवत</label>
                          <input type="text" value={cardData.samvat} onChange={(e) => handleInputChange('samvat', e.target.value)} placeholder="विक्रम संवत 2083" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                        </div>
                      </div>

                      <div className="pt-2 border-t border-slate-800 space-y-3">
                        <label className="text-xs font-bold text-amber-400 uppercase">📍 स्थान विवरण (Address Breakdown):</label>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          <input type="text" value={cardData.gram} onChange={(e) => handleInputChange('gram', e.target.value)} placeholder="ग्राम" className="px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.post} onChange={(e) => handleInputChange('post', e.target.value)} placeholder="पोस्ट" className="px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.thana} onChange={(e) => handleInputChange('thana', e.target.value)} placeholder="थाना" className="px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                          <input type="text" value={cardData.jila} onChange={(e) => handleInputChange('jila', e.target.value)} placeholder="जिला" className="px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white" />
                        </div>
                      </div>

                      <div className="space-y-1">
                        <label className="text-xs font-semibold text-slate-300">संपर्क नंबर (Contact Numbers)</label>
                        <input type="text" value={cardData.contactPhone} onChange={(e) => handleInputChange('contactPhone', e.target.value)} placeholder="+91 98765 43210, +91 94150 12345" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white" />
                      </div>
                    </div>
                  )}

                  {/* STEP 4: आशीर्वाद एवं संदेश (Blessings) */}
                  {currentStep === 4 && (
                    <div className="space-y-4 animate-fadeIn">
                      <div className="text-amber-400 font-rozha font-bold text-base border-b border-slate-800 pb-2">
                        💐 आशीर्वाद पंक्ति (Blessing Header Line):
                      </div>

                      <div className="space-y-1">
                        <label className="text-xs font-semibold text-slate-300">आशीर्वाद पंक्ति (Blessing Text)</label>
                        <textarea 
                          rows="4" 
                          value={cardData.blessingLine}
                          onChange={(e) => handleInputChange('blessingLine', e.target.value)}
                          placeholder="परम पूज्य दादाजी का पावन आशीर्वाद एवं परिवार के सभी वरिष्ठ जनों की छत्रछाया में..."
                          className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white"
                        ></textarea>
                      </div>
                    </div>
                  )}

                </div>

                {/* FORM FOOTER CONTROLS */}
                <div className="pt-6 border-t border-slate-800 flex items-center justify-between">
                  <button 
                    disabled={currentStep === 1}
                    onClick={() => setCurrentStep(prev => Math.max(1, prev - 1))}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-bold text-white flex items-center gap-1">
                    <i data-lucide="chevron-left" className="w-4 h-4"></i>
                    पीछे (Back)
                  </button>

                  <div className="flex gap-2">
                    {currentStep < 4 ? (
                      <button 
                        onClick={() => setCurrentStep(prev => Math.min(4, prev + 1))}
                        className="px-5 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold flex items-center gap-1">
                        आगे (Next)
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </button>
                    ) : (
                      <button 
                        onClick={() => setIsModalOpen(true)}
                        className="px-6 py-2 rounded-lg bg-gradient-to-r from-red-700 to-amber-500 hover:brightness-110 text-white text-xs font-extrabold flex items-center gap-2 shadow-lg">
                        <i data-lucide="sparkles" className="w-4 h-4"></i>
                        कार्ड उत्पन्न करें (Generate Card)
                      </button>
                    )}
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: STICKY REAL-TIME CARD PREVIEW */}
              <div className="lg:col-span-5 lg:sticky lg:top-24 space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span className="text-xs font-rozha font-bold text-white">लाइव कार्ड पूर्वावलोकन (Live Preview)</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => exportAsPNG(cardRef)}
                      disabled={isExporting}
                      className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-300 border border-amber-500/20">
                      PNG
                    </button>
                    <button 
                      onClick={() => exportAsPDF(cardRef)}
                      disabled={isExporting}
                      className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-rose-300 border border-rose-500/20">
                      PDF (300 DPI)
                    </button>
                  </div>
                </div>

                {/* Card Container Display */}
                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-center min-h-[520px] shadow-2xl overflow-x-auto">
                  <div className="transform scale-[0.55] sm:scale-[0.65] md:scale-[0.75] origin-center">
                    <WeddingCardTemplate data={cardData} innerRef={cardRef} />
                  </div>
                </div>
              </div>

            </div>
          </main>

          {/* FULL MODAL CARD GENERATOR */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full p-6 space-y-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-rozha font-bold text-amber-400">विवाह पत्रिका तैयार है (Final Wedding Card)</h3>
                  <button onClick={() => setIsModalOpen(false)} className="p-1 text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>

                <div className="flex justify-center bg-slate-950 rounded-xl p-4 overflow-x-auto">
                  <div className="transform scale-[0.85] sm:scale-100 origin-top">
                    <WeddingCardTemplate data={cardData} innerRef={modalCardRef} />
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button onClick={() => window.print()} className="px-4 py-2 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white">
                    🖨 प्रिंट करें (Print)
                  </button>
                  <div className="flex gap-2">
                    <button onClick={() => exportAsPNG(modalCardRef)} disabled={isExporting} className="px-4 py-2 rounded bg-amber-500 text-slate-950 text-xs font-extrabold">
                      🖼 PNG डाउनलोड
                    </button>
                    <button onClick={() => exportAsPDF(modalCardRef)} disabled={isExporting} className="px-4 py-2 rounded bg-red-700 text-white text-xs font-extrabold">
                      📄 PDF (300 DPI CMYK)
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
            <p className="font-rozha text-amber-400">पारंपरिक हिंदू विवाह पत्रिका निर्माता</p>
            <p>250mm x 210mm locked print standard layout.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
