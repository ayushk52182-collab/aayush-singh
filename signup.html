<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Parul University</title>
  <meta name="description" content="Create your Parul University account. Join 1 Lakh+ students on India's most vibrant university platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
</head>

<body>

  <!-- Back to Home -->
  <a href="./index.html" class="auth-back" id="backHome">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
    Back to Home
  </a>

  <!-- Theme Toggle -->
  <button class="auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

  <!-- Sign Up Page -->
  <main class="auth-page">
    <div class="auth-card" id="signupCard">

      <!-- Header -->
      <div class="auth-header">
        <div id="modeBadge" style="font-size: 11.5px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 12px;"></div>
        <div class="auth-logo">
          <svg viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" y1="8" x2="19" y2="14" />
            <line x1="22" y1="11" x2="16" y2="11" />
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">
          Already have an account? <a href="./login.html">Sign in</a>
        </p>
      </div>

      <!-- Alert Messages -->
      <div class="auth-alert auth-alert-error" id="errorAlert">
        <span class="auth-alert-icon">⚠️</span>
        <span id="errorMessage">Something went wrong.</span>
      </div>
      <div class="auth-alert auth-alert-success" id="successAlert">
        <span class="auth-alert-icon">✅</span>
        <span id="successMessage">Account created successfully!</span>
      </div>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" class="form-input" id="fullName" name="fullName" placeholder="Enter your full name" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-input" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" name="password" placeholder="Create a strong password" required minlength="6" autocomplete="new-password" />
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <span class="password-hint" id="strengthHint">Use at least 6 characters</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password" />
        </div>

        <button type="submit" class="auth-btn" id="signupBtn">
          <span class="btn-text">Create Account →</span>
          <div class="spinner"></div>
        </button>
      </form>

    </div>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
    (function () {
      'use strict';

      // ─── Theme Toggle ───
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('pu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pu-theme', next);
        themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      // ─── Mode Badge ───
      const modeBadge = document.getElementById('modeBadge');
      if (window.SupabaseAuth && modeBadge) {
        if (window.SupabaseAuth.isLiveMode()) {
          modeBadge.innerHTML = '🟢 Supabase Cloud Connected';
          modeBadge.style.background = 'rgba(104, 178, 155, 0.15)';
          modeBadge.style.color = '#10b981';
          modeBadge.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        } else {
          modeBadge.innerHTML = '⚡ Demo Mode &bull; Add Supabase credentials in supabase-config.js to connect live';
          modeBadge.style.background = 'rgba(212, 168, 67, 0.12)';
          modeBadge.style.color = '#b45309';
          modeBadge.style.border = '1px solid rgba(212, 168, 67, 0.25)';
        }
      }

      // ─── Elements ───
      const form = document.getElementById('signupForm');
      const btn = document.getElementById('signupBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');
      const passwordInput = document.getElementById('password');
      const strengthBar = document.getElementById('strengthBar');
      const strengthHint = document.getElementById('strengthHint');

      // ─── Password Strength Meter ───
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        strengthBar.className = 'password-strength-bar';

        if (val.length === 0) {
          strengthBar.className = 'password-strength-bar';
          strengthHint.textContent = 'Use at least 6 characters';
        } else if (val.length < 6) {
          strengthBar.classList.add('weak');
          strengthHint.textContent = 'Too short — needs at least 6 characters';
        } else if (val.length < 10 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) {
          strengthBar.classList.add('medium');
          strengthHint.textContent = 'Good — try adding uppercase & numbers';
        } else {
          strengthBar.classList.add('strong');
          strengthHint.textContent = 'Strong password ✓';
        }
      });

      // ─── Helper: Show Alert ───
      function showError(msg) {
        successAlert.classList.remove('show');
        errorMessage.textContent = msg;
        errorAlert.classList.add('show');
      }

      function showSuccess(msg) {
        errorAlert.classList.remove('show');
        successMessage.textContent = msg;
        successAlert.classList.add('show');
      }

      function hideAlerts() {
        errorAlert.classList.remove('show');
        successAlert.classList.remove('show');
      }

      // ─── Form Submit ───
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlerts();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validation
        if (!fullName) return showError('Please enter your full name.');
        if (!email) return showError('Please enter your email address.');
        if (password.length < 6) return showError('Password must be at least 6 characters.');
        if (password !== confirmPassword) return showError('Passwords do not match.');

        // Set loading
        btn.classList.add('loading');
        btn.disabled = true;

        try {
          const { data, error } = await window.SupabaseAuth.signUp(email, password, fullName);

          if (error) {
            showError(error.message);
          } else {
            if (data && data.session) {
              showSuccess('Account created successfully! Redirecting to dashboard...');
              setTimeout(() => {
                window.location.href = './dashboard.html';
              }, 1200);
            } else {
              showSuccess('Account created! Please check your email to verify your account, or sign in.');
              setTimeout(() => {
                window.location.href = './login.html';
              }, 2500);
            }
          }
        } catch (err) {
          showError('An unexpected error occurred. Please try again.');
          console.error(err);
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ─── Redirect if already logged in ───
      (async () => {
        const { data } = await window.SupabaseAuth.getSession();
        if (data.session) {
          window.location.href = './dashboard.html';
        }
      })();
    })();
  </script>

</body>

</html>
